<div class="block h-min-screen items-center justify-center bg-gray-100 p-5">
    <h1 class="text-center mb-5 text-[25px]">Clase: Matematicas</h1>
    <div class="h-min-screen blockitems-center justify-center bg-gray-100 grid grid-cols-1 md:grid-cols-3 gap-4" >
        <!-- Color asignatura con el mismo tutor #ff8787ed -->
       <div 
           [ngClass]="'max-w-md w-full space-y-1 p-5 shadow-lg rounded-lg m-auto cursor-pointer bg-[#d3ffd7]/75'" *ngFor="let classroom of data"
           > 
           <div class="h-[20px]">Estudiante: </div>
           <div class="h-[80px] content-center">{{ classroom.name }}</div>
       </div>
   </div>
</div>
