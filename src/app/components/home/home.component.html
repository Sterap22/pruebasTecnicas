<!--  Título principal -->
<h1 class="text-center mb-5 text-[25px]">Administrador reportes</h1>

<!--  Filtro de búsqueda -->
<div class="p-4">
  <input type="text" placeholder="Buscar estudiante..." [(ngModel)]="searchTerm" class="p-2 border w-full rounded" />
</div>



<div class="overflow-x-auto p-4">
  <!-- Tabla de notas -->
  <table class="min-w-full text-sm text-left text-gray-700 border border-gray-300 rounded-md">
    <thead class="bg-gray-100 text-xs uppercase text-gray-600">
      <tr>
        <th class="px-4 py-2">ID</th>
        <th class="px-4 py-2">Nombre</th>
        <th class="px-4 py-2">Profesor</th>
        <th class="px-4 py-2">Asignatura</th>
        <th class="px-4 py-2">Nota</th>
        <th class="px-4 py-2 text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
        <tr *ngFor="let note of paginatedNotes" class="border-t hover:bg-gray-50">
          <td class="px-4 py-2">{{ note.id }}</td>
          <td class="px-4 py-2">{{ note.student?.name }}</td>
          <td class="px-4 py-2">{{ note.teacher?.name }}</td>
          <td class="px-4 py-2">{{ note.name }}</td>
          <td class="px-4 py-2">{{ note.valor }}</td>
          <td class="px-4 py-2">
            <div class="flex justify-center gap-2">
              <button
                (click)="startEditNote(note)"
                class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs"
              >
                Editar
              </button>
              <button
                (click)="deleteNote(note.id)"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>
    </tbody>
  </table>

  <!-- Paginador -->
  <div class="mt-4 flex justify-center items-center gap-2">
    <button
      class="px-3 py-1 bg-gray-300 rounded hover:bg-gray-400 text-sm"
      (click)="changePage(currentPage - 1)"
      [disabled]="currentPage === 1"
    >
      Anterior
    </button>

    <ng-container *ngFor="let page of [].constructor(totalPages); let i = index">
      <button
        class="px-3 py-1 rounded text-sm"
        [ngClass]="{
          'bg-blue-500 text-white': currentPage === i + 1,
          'bg-gray-200 hover:bg-gray-300': currentPage !== i + 1
        }"
        (click)="changePage(i + 1)"
      >
        {{ i + 1 }}
      </button>
    </ng-container>

    <button
      class="px-3 py-1 bg-gray-300 rounded hover:bg-gray-400 text-sm"
      (click)="changePage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
    >
      Siguiente
    </button>
  </div>
</div>



<!--  Botón Registrar Nota -->
<div class="p-4 flex justify-end">
  <button (click)="openCreateModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
    Registrar Nota
  </button>
</div>


<!--  Modal para registrar/actualizar nota -->
<div *ngIf="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded-lg w-[90%] md:w-[500px] relative">
    <button (click)="closeCreateModal()" class="absolute top-2 right-2 text-red-500 text-xl">&times;</button>
    <h2 class="text-xl font-bold mb-4">
      {{ isEditMode ? 'Actualizar Nota' : 'Registrar Nueva Nota' }}
    </h2>

    <form (ngSubmit)="submitNote()" #noteForm="ngForm" class="space-y-3">
      <input type="text" placeholder="Materia" [(ngModel)]="newNote.name" name="subject" required
        class="w-full border p-2 rounded" />

      <input type="number" placeholder="Nota (0-100)" [(ngModel)]="newNote.valor" name="value" required
        class="w-full border p-2 rounded" />

      <!--  Select de estudiante -->
      <select [(ngModel)]="newNote.idStudent" name="studentId" required class="w-full border p-2 rounded">
        <option value="0" disabled selected>Selecciona un estudiante</option>
        <option *ngFor="let student of students" [value]="student.id">{{ student.name }}</option>
      </select>

      <!--  Select de profesor -->
      <select [(ngModel)]="newNote.idTeacher" name="teacherId" required class="w-full border p-2 rounded">
        <option value="0" disabled selected>Selecciona un profesor</option>
        <option *ngFor="let teacher of teachers" [value]="teacher.id">{{ teacher.name }}</option>
      </select>

      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">
        {{ isEditMode ? 'Actualizar Nota' : 'Guardar Nota' }}
      </button>
    </form>
  </div>
</div>
